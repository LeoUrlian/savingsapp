# Produção em UMA máquina com Docker (qualquer VPS ou a sua própria).
#
#   1) copie .env.prod.example para .env.prod e preencha
#   2) docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Só o Caddy abre portas para fora (80 e 443). O banco e a API ficam na rede
# interna do Docker.
#
# O nome do projeto é próprio de propósito: sem ele, este arquivo dividiria
# contêineres e o volume do banco com o docker-compose.yml de desenvolvimento.
name: savingsapp-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: savings
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env.prod}
      POSTGRES_DB: savings
    volumes:
      - savings_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U savings -d savings"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: "3333"
      DATABASE_URL: postgresql://savings:${POSTGRES_PASSWORD}@postgres:5432/savings
      WEB_ORIGIN: https://${DOMAIN:-localhost}
      # Atrás do Caddy: confia no IP real que ele repassa (limite de login por IP).
      TRUST_PROXY: "true"
      # IA (opcional). Sem estas três a rota de análise responde 503.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3333/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Endereço da API visto pelo NAVEGADOR (gravado no build).
        NEXT_PUBLIC_API_URL: https://${DOMAIN:-localhost}/api
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      # Endereço da API visto pelo SERVIDOR do Next (rede interna do Docker).
      API_INTERNAL_URL: http://api:3333

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  savings_pgdata:
  caddy_data:
  caddy_config:
