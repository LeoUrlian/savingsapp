# Postgres local para desenvolvimento.
# Sobe com: pnpm db:up   (equivale a: docker compose up -d)
services:
  postgres:
    image: postgres:16-alpine
    container_name: savings-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: savings
      POSTGRES_PASSWORD: savings_dev_pw
      POSTGRES_DB: savings
    ports:
      - "5432:5432"
    volumes:
      - savings_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U savings -d savings"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  savings_pgdata:
