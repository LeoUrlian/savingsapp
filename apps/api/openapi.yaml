openapi: 3.0.3
info:
  title: SavingsApp API
  version: "0.1.0"
  description: >
    Coleção de testes da SavingsApp (Fatia 1). Importe este arquivo no Insomnia
    (Create > Import > From File). Ele cria as requisições do CRUD de metas e
    aportes já com exemplos de corpo. Ajuste o {goalId} nas rotas de detalhe/
    aporte com o id retornado ao criar uma meta.
servers:
  - url: http://localhost:3333
    description: API local (pnpm --filter @savings/api start:dev)
security:
  - cookieAuth: []
paths:
  /health:
    get:
      summary: Health check
      security: []
      responses:
        "200": { description: API no ar }
  /rates:
    get:
      summary: Cotacao de cambio (1 unidade da moeda base em BRL, USD e EUR)
      description: >
        Fonte - Frankfurter (BCE), sem chave. Cache de 1h em memoria; se a
        fonte cair, devolve a ultima cotacao guardada.
      parameters:
        - name: base
          in: query
          required: false
          description: Moeda base (padrao BRL)
          schema: { type: string, enum: [BRL, USD, EUR], default: BRL }
      responses:
        "200":
          description: Cotacao
          content:
            application/json:
              example:
                base: BRL
                date: "2026-11-16"
                rates: { BRL: 1, USD: 0.17528, EUR: 0.15914 }
        "400": { description: Moeda base invalida }
        "502": { description: Servico de cambio indisponivel e sem cotacao guardada }
  /auth/register:
    post:
      summary: Criar conta e entrar
      description: >
        Cria a conta e ja devolve o cookie de sessao (session). A primeira
        conta do sistema herda as metas criadas antes do login existir.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
            example:
              email: voce@exemplo.com
              password: uma-senha-com-8-ou-mais
      responses:
        "201":
          description: Conta criada. Define o cookie session (httpOnly).
          content:
            application/json:
              example: { id: "uuid", email: "voce@exemplo.com" }
        "400": { description: E-mail invalido ou senha com menos de 8 caracteres }
        "409": { description: E-mail ja cadastrado }
  /auth/login:
    post:
      summary: Entrar
      description: >
        Define o cookie session (httpOnly, SameSite=Lax, 7 dias; Secure em
        producao). Apos 5 falhas em 15 minutos para o mesmo IP e e-mail, a API
        responde 429. O Insomnia guarda o cookie sozinho.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "200":
          description: Logado
          content:
            application/json:
              example: { id: "uuid", email: "voce@exemplo.com" }
        "401": { description: E-mail ou senha incorretos (a mesma mensagem nos dois casos) }
        "429": { description: Muitas tentativas }
  /auth/logout:
    post:
      summary: Sair (apaga a sessao no servidor e o cookie)
      responses:
        "204": { description: Saiu }
        "401": { description: Sem sessao valida }
  /auth/me:
    get:
      summary: Quem esta logado
      responses:
        "200":
          description: Usuario
          content:
            application/json:
              example: { id: "uuid", email: "voce@exemplo.com" }
        "401": { description: Sem sessao valida }
  /goals:
    get:
      summary: Listar metas
      responses:
        "200": { description: Lista de metas }
    post:
      summary: Criar meta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGoal"
            example:
              name: Reserva de emergência
              targetAmountCents: 1000000
              baseCurrency: BRL
              targetDate: "2027-12-31"
      responses:
        "201": { description: Meta criada }
        "400": { description: Dados inválidos }
  /goals/{goalId}:
    get:
      summary: Detalhar meta (savedAmountCents = soma dos aportes, convertidos para a moeda da meta pela cotacao do dia)
      parameters:
        - $ref: "#/components/parameters/GoalId"
      responses:
        "200": { description: Meta }
        "404": { description: Meta não encontrada }
    patch:
      summary: Atualizar meta (parcial)
      parameters:
        - $ref: "#/components/parameters/GoalId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGoal"
            example:
              name: Reserva de emergência (6 meses)
              targetAmountCents: 1500000
      responses:
        "200": { description: Meta atualizada }
        "404": { description: Meta não encontrada }
    delete:
      summary: Remover meta (cascade apaga os aportes)
      parameters:
        - $ref: "#/components/parameters/GoalId"
      responses:
        "204": { description: Removida }
        "404": { description: Meta não encontrada }
  /goals/{goalId}/stats:
    get:
      summary: Metricas da meta (historico, ritmo, projecao, aportes por mes)
      description: >
        Aportes em outra moeda sao convertidos para a moeda da meta pela
        cotacao do dia. O ritmo e o total guardado dividido pelos dias desde o
        primeiro aporte, com janela minima de 30 dias. A projecao assume esse
        ritmo constante. projectedDate some se a meta ja foi atingida ou nao ha
        aportes. onTrack so existe se a meta tem data-alvo. Os meses (monthly)
        sao contados no fuso de Brasilia (UTC-3), do primeiro aporte ate o mes atual, com meses
        vazios em 0. requiredMonthlyCents e quanto guardar por mes para bater a
        data-alvo (prazo minimo de 1 mes na conta); daysToTarget e negativo se o
        prazo ja passou. Os dois so existem com data-alvo.
      parameters:
        - $ref: "#/components/parameters/GoalId"
      responses:
        "200":
          description: Metricas
          content:
            application/json:
              example:
                goalId: "ckx123"
                currency: BRL
                targetAmountCents: 100000
                savedAmountCents: 30000
                progressPct: 30
                depositCount: 2
                monthlyPaceCents: 15219
                history:
                  - { date: "2026-09-24T12:00:00.000Z", cumulativeCents: 20000 }
                  - { date: "2026-11-10T12:00:00.000Z", cumulativeCents: 30000 }
                monthly:
                  - { month: "2026-09", amountCents: 20000 }
                  - { month: "2026-10", amountCents: 0 }
                  - { month: "2026-11", amountCents: 10000 }
                projectedDate: "2027-04-12T12:00:00.000Z"
                requiredMonthlyCents: 30000
                daysToTarget: 60
                reached: false
                onTrack: true
        "404": { description: Meta nao encontrada }
  /goals/{goalId}/advice:
    post:
      summary: Analise da meta escrita por IA
      description: >
        Gera um texto curto (ate 120 palavras) sobre a situacao da meta. A IA
        recebe so numeros ja formatados (valores em reais, datas dia/mes/ano e o
        prazo por extenso). Nome da meta, ids e datas dos aportes nao saem do
        servidor. Usa qualquer provedor no formato da OpenAI. Configure no .env
        - OPENAI_API_KEY, AI_MODEL e, opcionalmente, AI_BASE_URL (padrao
        https://api.openai.com/v1). Cada chamada pode gastar credito do provedor.
      parameters:
        - $ref: "#/components/parameters/GoalId"
      responses:
        "200":
          description: Analise
          content:
            application/json:
              example:
                text: "Voce ja guardou R$ 10.000,00 de R$ 20.000,00 (50%)..."
                model: openai/gpt-oss-20b
        "404": { description: Meta nao encontrada }
        "502": { description: Provedor de IA indisponivel ou recusou }
        "503": { description: IA nao configurada (faltam OPENAI_API_KEY ou AI_MODEL) }
  /goals/{goalId}/deposits:
    get:
      summary: Listar aportes da meta
      parameters:
        - $ref: "#/components/parameters/GoalId"
      responses:
        "200": { description: Lista de aportes }
    post:
      summary: Registrar aporte
      parameters:
        - $ref: "#/components/parameters/GoalId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDeposit"
            example:
              amountCents: 30000
              currency: BRL
      responses:
        "201": { description: Aporte registrado }
        "400": { description: Dados inválidos }
        "404": { description: Meta não encontrada }
  /goals/{goalId}/deposits/{id}:
    delete:
      summary: Remover aporte
      parameters:
        - $ref: "#/components/parameters/GoalId"
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Removido }
        "404": { description: Aporte não encontrado }
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session
      description: Cookie definido por /auth/login ou /auth/register.
  parameters:
    GoalId:
      name: goalId
      in: path
      required: true
      description: id da meta (cole o id retornado ao criar uma meta)
      schema: { type: string }
  schemas:
    Credentials:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 8, maxLength: 200 }
    CreateGoal:
      type: object
      required: [name, targetAmountCents]
      properties:
        name: { type: string, maxLength: 120 }
        targetAmountCents: { type: integer, minimum: 1 }
        baseCurrency: { type: string, enum: [BRL, USD, EUR] }
        targetDate: { type: string, format: date-time }
    UpdateGoal:
      type: object
      properties:
        name: { type: string, maxLength: 120 }
        targetAmountCents: { type: integer, minimum: 1 }
        baseCurrency: { type: string, enum: [BRL, USD, EUR] }
        targetDate: { type: string, format: date-time }
    CreateDeposit:
      type: object
      required: [amountCents]
      properties:
        amountCents: { type: integer, minimum: 1 }
        currency: { type: string, enum: [BRL, USD, EUR] }
