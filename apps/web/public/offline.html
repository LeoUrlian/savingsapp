<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#16a34a" />
    <title>Sem conexão · SavingsApp</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, sans-serif;
        background: #09090b;
        color: #f4f4f5;
        text-align: center;
        padding: 2rem;
      }
      main { max-width: 22rem; }
      h1 { font-size: 1.5rem; margin: 0 0 0.5rem; }
      p { color: #a1a1aa; margin: 0 0 1.5rem; }
      button {
        background: #16a34a;
        color: #fff;
        border: 0;
        border-radius: 0.5rem;
        padding: 0.6rem 1.2rem;
        font-size: 1rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sem conexão</h1>
      <p>
        O SavingsApp precisa de internet para mostrar as suas metas. Confira a
        conexão e tente de novo.
      </p>
      <button onclick="location.reload()">Tentar de novo</button>
    </main>
  </body>
</html>
